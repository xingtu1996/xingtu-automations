  - slug: skill-evolution-miner
    category: 工作
    id: b066fba0-2fb2-43d3-a9ef-a11f4755d15f
    name: 技能进化周分析（会话驱动）
    status: ACTIVE
    ring: L3
    schedule:
      rrule: FREQ=WEEKLY;BYDAY=MO;BYHOUR=11;BYMINUTE=0
      cron: "0 11 * * 1"
      human: 每周一 11:00
    cwd:
      - <WORKSPACE_ROOT>
    purpose: 扫 xingtu 白名单会话源 -> 任务域热度 -> 创建/更新/下线三张清单 -> vault 报告（只供 boss 拍板，不自建/删 skill）。
    artifacts:
      - <WORKSPACE_ROOT>/github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/技能进化分析/技能进化分析_<日期>.html
    prompt: |
      【路径纪律】工作空间唯一根 = <WORKSPACE_ROOT>（~/工作室/xingtu 是废弃副本，禁止触碰）。产出只落 vault：github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/技能进化分析/。严禁写主区 outputs/（非 git 仓，云端 agent 看不见）。
      【任务】运行 <PYTHON> tools/skill_evolution_miner.py，读取 data/skill_evolution_latest.json 的三张清单（创建/更新/下线候选），向 boss 汇报。
      【汇报格式】①任务域热度 Top5（用户实际在干什么）②创建候选 Top3 ③下线候选 Top5（标注 converge_ok：✅可收敛/⏸️停手待审）④更新候选 Top3 ⑤规模告警（语料文件数/prompt 数/脱敏率异常时置顶加粗）。
      【成功标准】①脚本退出码 0 ②vault 当日「技能进化分析_<日期>.html」存在且 mtime 为今天 ③汇报含三张清单与告警。
      【失败处理】脚本报错读 traceback 修一次；仍失败停止并报告，禁止反复重试。语料 <100 文件或 prompt <500 触发规模告警时照常出报告但标注「低置信度」。
      【规模告警】语料文件 <100 或 >2000、prompt <500、禁词剔除率 >30% → 置顶加粗告警。
      【隐私铁律 SAF-010】脚本内置白名单只扫 xingtu 会话源；禁止把雇主项目（tfm-ng/ctf-gitlab/haiting 等）会话内容写进任何产出；报告样本仅限脚本脱敏后的内容。
      【禁止动作】不自动创建/删除任何 skill（三张清单只供 boss 拍板）；不 push 任何公开仓。
