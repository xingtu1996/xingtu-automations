      【路径纪律】工作空间唯一根目录 `<WORKSPACE_ROOT>`。仓库本地副本在 `<WORKSPACE_ROOT>/github/*` 与 `<WORKSPACE_ROOT>/md2wechat/`。
      【工具纪律】`gh` 实体在 `/opt/homebrew/bin/gh`（不在 PATH），需先 `export TOKEN=$(printf "protocol=https\nhost=github.com\n" | git credential-osxkeychain get | awk -F= '/^password/{print $2}')` 再 `GH_HOST=github.com GH_TOKEN="$TOKEN" /opt/homebrew/bin/gh ...`。**github.com 的 SSH 不通**，push 一律走 HTTPS 或 `tools/gh_push_api.py`（走 Contents API，自动跳过相同文件，用法 `python3 tools/gh_push_api.py <目录> <owner/repo> [--dry-run]`）。

      【巡检项】
      1) **隐私复扫（最高优先级）**：`python3 tools/privacy_scan.py`（规则 15 条分级：🔴致命/🟠高危/🟡提示）。🔴 项必须当场修掉并 commit；修不了的写入报告「待 boss 拍板」。
         重点复检：中文真名与拼音、英文名 `英文名 Li` 及变体（SAF-010 已裁决全面禁用）、客户名、内部项目代号、金额/人天、在职自述、内部运营文档。
      2) **未提交/未推送**：逐个仓 `git status --porcelain` 与 `git log @{u}..HEAD`，列出有残留的仓与改动摘要。有改动的提示补 commit（不要自动 commit）。
      3) **门面一致性**：公开仓 README 是否都有「关于作者」区块（公众号「行途技术」钩子）与 License 段；`github/xingtu1996/README.md` 的开源矩阵是否覆盖全部公开仓（当前 19 个）。
      4) **子模块指针**：`github/xingtu-harness` 的 6 个子模块是否停在旧 gitlink（曾出现过：clone 下来拿到旧子仓）。落后则提示同步。
      5) **内容缺口**：`github/xingtu-articles` 的 README 索引是否覆盖 articles/ 下全部 md；`tuitu/` 是否有新增贴图未归档。
      6) **已发布归档**：检查 `github/xingtu-vault/09_个人台账/03_已发布文章档案/` 有无新增发布记录未同步到 articles 仓。

      【产出】
      - 单文件零依赖 HTML 报告写入 `<WORKSPACE_ROOT>/github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/开源矩阵巡检/开源矩阵巡检_YYYY-MM-DD.html`（行途技术蓝 #056DE8 主色，离线可开）
      - 结构：总览健康度评分 / 🔴 必修项（含具体文件与行）/ 各仓状态表 / 内容缺口 / 待 boss 拍板项
      - 回写 CHANGELOG：`python3 tools/changelog_append.py --type "🔧" --path "github/*" --desc "..." --tool workbuddy`

      【红线】
      - 不自动 push（除非 boss 已批准的具体修复）、不改仓库可见性、不 force push、不删仓库
      - 隐私修复属于止损动作，可直接执行并 commit（但**不自动 push**，在报告里列出待推送清单）
      - 结尾给 boss 一句话结论 + 需要他拍板的项（用表格，给出推荐项）

