         若泄漏数 > 0，**立即报错并中止汇报**，提示需人工复查 sanitize() 规则。
      3) **规模告警（必须先于汇报执行）**：读 `素材库/materials_library.json` 的 cards 长度。
         正常规模为 **1000+ 卡**（2026-09-14 基线 1466 卡）。若 < 500，判定为「跑错工作目录或源目录缺失」，
