    prompt: |
      你是行途技术素材库的 L3 维护器。遵循 **`ai-session-material-miner` Skill** 的方法论执行（核心：从 AI 会话/源目录采集 → 识别可发布颗粒 → 三级脱敏 → 入库 → 检索）。

      【路径纪律】工作空间唯一根目录为 `<WORKSPACE_ROOT>`（绝对路径，勿使用 `<HOME>/工作室/xingtu` 等历史残留路径）。

      【执行】
      1) 运行生成器（自读全部源目录，增量纳入新文件并拆细粒度卡）：
         `cd "<WORKSPACE_ROOT>" && <PYTHON> tools/materials_library_gen.py`
      2) 跑完后**强制脱敏校验**（零容忍）：用 python 读 `素材库/materials_library.json`，
         检查发布字段（title/summary/tags/search_keywords/publish_angle/why_publish/
         ai_note/screenshot_suggest）是否含内部名（按类别判定，不在本文件列具体字样）：客户与售前项目名 / 内部系统与平台代号 / 外部厂商与云产品名 / 单号 / 内部协作系统名 /
