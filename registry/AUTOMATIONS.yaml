      【完成判定·查凭证不问自述】
      必须同时满足才算完成：1) stat -f '%Sm' <WORKSPACE_ROOT>/github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/数据复盘/数据复盘_$(date +%F).md 的 mtime 是今天；2) 该文件含②判断层且每条有 [信号强度] 标注；3) 顶部写明数据截止日。脚本可能静默失败留下旧文件，务必核对 mtime，不冒充已生成。

