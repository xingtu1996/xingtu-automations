# ============================================================
# 行途技术 · 多 Agent 定时任务 Registry（Tool-Neutral · 公开镜像）
# ============================================================
# 本文件是公开镜像：路径用占位符（<WORKSPACE_ROOT>/<HOME>/<PYTHON>），
# 平台侧重建时替换为实际值。私有全量真源在工作区 .harness/scheduled/
# （含真实路径与完整 spec），纪律：平台任何变更必须先回写私有 registry 再同步本镜像。
# ============================================================
# 定位：**可迁移的镜像档案**，不是运行时事实源。
#   · 运行时事实源 = 平台本身（WorkBuddy automation_update / CC scheduled_tasks.json / crontab）
#   · 本文件     = 意图（prompt 全文）+ 排期 + 产物 + 工作目录 的跨工具可读快照
#
# 用途：① 换 harness（Claude Code / Codex / 其他 agent 工具）时照本文件重建任务
#       ② 审计「这个工作空间上一共挂着几个自动化、各自在动哪些文件」
#       ③ 排查漂移：平台实际排期 vs 本文件记载不一致时，一眼看出来
#
# 纪律：每次在平台上新增 / 修改 / 删除自动化后，**必须回来同步本文件**。
#       派生文档（README / MIGRATION.md）只做索引与映射，**不复述 prompt 正文**——
#       避免出现「正文改了 7 版、说明书还在 v2」的版本漂移。
#
#
# 🔴 公开化红线（SAF-010 相关 · 2026-09-14 加）
#   本文件的 prompt 正文含**内部项目名与业务代号**（某零售重构项目 / 某零售集团 / 某零售平台 / 某售前项目 / 内部协作系统 /
#   含内部项目名与业务代号（已按类别泛化）、私人绝对路径与内部仓库名，禁原样公开。
#   → 本文件**仅供本地私有 harness 使用，禁止同步进任何公开仓**。
#   → 尤其注意 `github/xingtu-harness`（= github.com/xingtu1996/xingtu-harness，**公开仓**）：
#     2026-09-14 实测其内**尚无** scheduled/automations 目录，请保持现状。
#   → 若要开源这套 harness：必须先 desensitize（内部名换占位符），或只开源
#     MIGRATION.md 的方法论部分（该文件不含内部名）。
#
# 首次留档：2026-09-14（全量 10 条）
# ============================================================

schema_version: 1
updated: "2026-10-14"
workspace_root: <WORKSPACE_ROOT>
timezone: Asia/Shanghai
platform_of_record: WorkBuddy (automation_update)

# ------------------------------------------------------------
# 排期字段说明
#   rrule : 平台原生表达式（WorkBuddy 用 RFC 5545 RRULE）
#   cron  : 等价 5 段 cron，可直接进 crontab / 转 GitHub Actions schedule
#   human : 人读口径（北京时间 UTC+8）
# ------------------------------------------------------------

# ------------------------------------------------------------
# 路径纪律（最高优先级 · 2026-09-14 血泪）
# ------------------------------------------------------------
path_discipline:
  rule: 所有任务的工作目录、脚本调用、读写路径，一律锚定 workspace_root 绝对路径。
  banned_path: <HOME>/工作室/xingtu
  banned_reason: >-
    该目录是 2026-09-05 前后产生的**残留副本**（与唯一根 inode 不同，非软链）。
    残留区素材库仅 12 卡，唯一根素材库 1466 卡。任务跑在残留区 = 对着空壳干活，
    产物落进没人看的目录，且不会报错。
  scale_guard: >-
    凡读取关键数据文件（如 素材库/materials_library.json）的任务，必须在 prompt 里
    写明「正常规模」（如 1000+ 卡），异常时**中止并报错**，不得基于残缺数据继续。
  detection: |
    ls -ldi <WORKSPACE_ROOT> <HOME>/工作室/xingtu    # inode 必须不同才算事故
    wc -c <WORKSPACE_ROOT>/素材库/materials_library.json        # 正常 2.3MB 量级

# ============================================================
# 自动化清单（按执行时刻排序）
# ============================================================
automations:

  # ------------------------------------------------ T-WB-01
  - slug: session-broadcast-collect
    category: 创作
    id: b27584d3-843b-4448-8a84-4a279f19bc64
    name: AI会话广撒网采集·主题与自媒体潜力分析（每日累积沉淀）
    status: ACTIVE
    ring: L1
    schedule:
      rrule: FREQ=DAILY;BYHOUR=2;BYMINUTE=0
      cron: "0 2 * * *"
      human: 每天 02:00
    cwd:
      - <WORKSPACE_ROOT>/tools
    purpose: 全量采集 boss×AI 历史会话 → 打主题标签 + 评自媒体潜力分 → 累积进 DB → 刷看板。数据底座。
    artifacts:
      - <WORKSPACE_ROOT>/tools/sessions_analysis.json
      - <WORKSPACE_ROOT>/tools/sessions_dashboard.html
    prompt: |
      你是行途技术的「AI 协作会话大数据」采集分析助手。每日对 boss 与 AI（Claude Code 等）的【全部】历史会话做增量采集与主题/自媒体潜力分析，把结果累积进本地 DB 并刷新可浏览看板，为个人 IP 反哺提供数据底座。

      【路径纪律】工作空间唯一根目录为 `<WORKSPACE_ROOT>`（绝对路径，勿使用其他历史路径）。所有脚本、DB、看板一律读写该目录下的 `tools/`。

      【输入源】
      - 全量会话：`~/.claude/projects/**/*.jsonl`（金矿，含子代理会话）
      - 素材库（用于交叉标记「已选题」）：`<WORKSPACE_ROOT>/github/xingtu-vault/02_素材库/对话挖掘/`
      - 工具与 DB 落盘处：`<WORKSPACE_ROOT>/tools/`
        - `sessions_analyzer.py`（采集+分析+生成 dashboard）
        - 脚本跑完自动调 <WORKSPACE_ROOT>/github/xingtu-desk/tools/db.py sync（任务跑完即入库，2026-09-29 boss 定）
        - `sessions_analysis.json`（累积 DB）
        - `sessions_dashboard.html`（可浏览看板）
      - Python：`<PYTHON>`

      【执行步骤】
      1) 跑分析器（增量，只解析 DB 里没有的新会话；带 --min-potential 55 控制看板门槛）：
         `cd <WORKSPACE_ROOT>/tools && <PYTHON> sessions_analyzer.py --min-potential 55`
         说明：首次或需要全量校准时加 `--rebuild`。脚本会自动扫描全部会话、逐会话打主题标签（AI工具链/自动化/部署运维/数据处理/前端UI/调试排错/方法论项目管理）、评自媒体转化潜力分(0-100)、交叉比对素材库标记「已选题/未选题」、累积写 DB、并生成单文件离线 dashboard。
      2) 若脚本报错，不要中断：记录错误，改用 `find ~/.claude/projects -name "*.jsonl" -newermt "-2 days"` 兜底确认近期确有新会话，并在汇报里说明走了兜底。
      3) 读取 DB 关键指标（用 python 读 `sessions_analysis.json`）：
         - 总会话数、主会话数、高潜力(>=55)数、已转化为选题数、未选题高潜力数；
         - 主题赛道分布；近 2 天新增会话数（按 `updated_at` 或文件 mtime 判断）。
      4) 用中文向用户简短汇报：今日新增分析会话数、累积规模、高潜力未选题缺口数、主题分布概况、dashboard 路径。约束：仅本地汇总汇报，绝不对外发布或推送；不修改 ~/.claude/projects 与素材库任何文件（只读）。

      【这是「广撒网→分析→沉淀」数据底座，与另一个任务（每日从 DB 挑高潜力未选题生成 1 篇素材）配合，共同反哺行途技术个人 IP。】

  # ------------------------------------------------ T-WB-02
  - slug: daily-trend-scan
    category: 信源
    id: e3880a98-15b1-4c1c-9077-d92b4875c040
    name: 每日舆情扫描与爆款选题推荐
    status: ACTIVE
    ring: L4
    schedule:
      rrule: FREQ=DAILY;BYHOUR=9;BYMINUTE=0
      cron: "0 9 * * *"
      human: 每天 09:00
    cwd:
      - <WORKSPACE_ROOT>
    purpose: 并行 WebSearch 抓 24-48h AI 热点 → 与选题池/素材交叉匹配 → 5 维爆款打分出 Top3 → 产 HTML 舆情日报。
    artifacts:
      - <WORKSPACE_ROOT>/github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/舆情日报/舆情日报_YYYY-MM-DD.html
      - （跑完立即入库）<WORKSPACE_ROOT>/github/xingtu-desk/data/xingtu.db
    prompt: |
      这是行途技术自媒体工作区（根目录 <WORKSPACE_ROOT>）的每日舆情作战任务，产出今日舆情日报。

      执行步骤：
      1. 舆情采集：用 WebSearch 并行搜索（3-5 组查询）过去 24-48h AI 行业热点，覆盖：大模型新发布/降价/缓存价格、Agent 与 AI 编程工具链（Claude Code/OpenCode/Codex/WorkBuddy 等）、值得关注的 GitHub 开源项目、行业大事件。每组结果必须记录来源链接。
      2. 素材匹配：读取选题池 SSoT「xingtu-vault/02_内容仓库 (Content Hub)/01_灵感与选题池/2026-选题池.md」，以及 outputs/ 下最新的「素材库时令性分析_*.json」（若存在）；把今日热点与既有选题/素材交叉匹配，热点必须能挂上已有素材或选题池编号（T-xxx），挂不上的标注「新热点·无素材储备」。
      3. 爆款评分：对候选选题按 5 维打分并加权：时效性30%（<24h=5分/72h内=3/常青=1）、话题热度25%（搜索结果量级与头部覆盖）、素材匹配度20%、受众契合度15%（技术经理/Vibe Coder 关注工具链>模型新闻>资本新闻）、独家性10%（能否挂一手实测/账单/流水线）。输出 Top3。
      4. 日历建议：读取发布日历 SSoT「xingtu-vault/03_运营工具箱 (Operations Toolkit)/」下的 00_全局发布日历_2026-09.md，对照 Top3 给出替换/补充/顺延建议，只建议不修改日历。若发现日历与发布日志排期矛盾，在日报中标注「待统一」。
      5. 产出：单文件零依赖 HTML 日报（离线可开，行途技术蓝 #056DE8 主色），写入 <WORKSPACE_ROOT>/github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/舆情日报/舆情日报_YYYY-MM-DD.html（用当天日期）。结构：今日热点（带来源链接）/ Top3 爆款选题（含 5 维分数与推荐理由）/ 日历调整建议 / 风险提示（素材缺口、待统一矛盾项）。所有数字标注来源。
      6. 红线：不修改选题池（入库只能走 tools/topic_pool_pipeline.py）；不修改发布日历；不产出任何待发布稿件全文；不生成对外发布内容；最终发布决策留给 boss。

  # ------------------------------------------------ T-WB-11（按时刻插入，编号=创建序号非排序号）
  - slug: mp-data-review-daily
    category: 创作
    id: 26ff39b1-6458-40a0-9d80-44537d11c923
    name: 行途技术公众号数据复盘·操盘手判断（每日 09:40）
    status: ACTIVE
    ring: L4
    schedule:
      rrule: FREQ=DAILY;BYHOUR=9;BYMINUTE=40
      cron: "40 9 * * *"
      human: 每天 09:40
    cwd:
      - <WORKSPACE_ROOT>
    purpose: >-
      后顾式「数据复盘」——拉后台快照 → 事实/操盘手判断/假设对账/策略建议四段 → 推微信。
      区别于 mp-daily-ops-report（前瞻式「发什么/怎么发」决策指令）：本任务不产出排期决策，
      只回答「数据讲了什么、假设成立还是被推翻、策略要不要调」。
    artifacts:
      - <WORKSPACE_ROOT>/github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/数据复盘/数据复盘_YYYY-MM-DD.md
    notes: >-
      2026-09-18 新建。动因：boss 要求「每天公众号数据复盘，作为资深操盘手结合数据有个自己的判断」。
      背景：原 09:30 晨间决策日报自动化已在平台丢失且未登记入本档案，故「看数据→给判断」一度真空；
      本任务与决策日报职责划清，不双份维护。核心增量＝冷启动样本量护栏（每条结论强制标 [信号强度]，
      连续 3 天同向或数量级差异才可标强），防止 50 粉规模下把噪声当信号做策略转向。
    prompt: |
      在 <WORKSPACE_ROOT> 工作区执行「公众号每日数据复盘」，角色 = 资深全平台 IP 操盘手（先读根 AGENTS.md 确认含「行途技术」，再读 RULER.md 建立角色预设）。

      【定位·务必厘清】本任务 = 后顾式「数据复盘」，不是前瞻式「发什么/怎么发」决策指令（后者归 .agents/skills/mp-daily-ops-report/SKILL.md，职责不重叠、不互相替代）。本任务只审视已有的真实数据：昨天和过去一个窗口到底发生了什么、验证了还是推翻了哪个假设、下一步策略要不要调。严禁写成"昨日新增 X / 阅读 Y"的流水账搬运，也严禁写成进度汇报。

      【路径纪律·最高优先级】
      - 工作区唯一根 = <WORKSPACE_ROOT>。所有读写路径一律锚定此绝对路径，禁止 cd 到其他根目录。
      - 禁用残留目录 <HOME>/工作室/xingtu（与唯一根 inode 不同的旧副本，在其上执行 = 对着空壳干活且不报错）。
      - 规模告警：执行前先 ls -l <WORKSPACE_ROOT>/data/stats_*.json。若最新快照不存在，或存在但体量远低于 15KB（正常约 18-20KB 量级），立即中止并以「数据规模异常·疑似跑错工作区或拉取失败」报错，不得基于残缺快照产出结论。

      【执行五步】
      1) 拉快照：cd <WORKSPACE_ROOT> && python3 tools/mp_stats_puller.py --pull
         - 成功 → data/stats_YYYY-MM-DD.json（同日重跑覆盖）
         - 两类典型失败：40164（IP 白名单，无自救）/ bsk 未登录（需 boss 打开 Chrome 登录 mp.weixin.qq.com）。失败则记录原因、跳过拉取、用现有最新快照继续，并在复盘顶部注明"数据截止 <日期>"。禁止循环重试轰炸。
      2) 跑数据底座：python3 tools/mp_daily_report.py --days 7（产出 <WORKSPACE_ROOT>/github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/运营日报/运营日报_YYYY-MM-DD.md）。本任务对它只读取消费、绝不改写覆盖；即使当日该文件已被别的管线占用也不重写。
      3) 口径校准（关键，🔴 2026-09-18 实锤教训）：
         - 证据等级排序：data/stats_*.json（bsk 只读后台发表记录）= 一级事实源 ＞ 发布日志/台账 ＞ 排期表。禁止把发布台账当凭证层用。
         - 已实证事故：发布日志_2026-09.md 的 09-16/09-17/09-18 三行把「计划行」当「实际行」登记（真实应为 9/16 AGENT-03 阅读 133、9/17 FDE-07 阅读 78）。凡引用阅读/分享数字，必须从 stats 快照取；引用台账数字时须标注「台账口径·待后台校准」。
         - 引用任何数字必须标注来源与口径，禁止把"平台记账/发布日志预估/排期推断"与后台真值混用而不加注。
      4) 写 <WORKSPACE_ROOT>/github/xingtu-vault/03_运营工具箱 (Operations Toolkit)/定时任务产出/数据复盘/数据复盘_YYYY-MM-DD.md，四段结构（这是本任务的核心交付，自建独立文件，不写入上述运营日报）：
         ① 事实层：昨日 + 近 7 天关键指标（阅读/分享/分享率/新增关注/总粉），只列对本复盘有解释力的数字，不铺全量表。必须标注数据截止日与取数来源。
         ② 判断层（操盘手立言，本节不许空）：基于数据给出 2-3 条「我的判断」，每条格式 = 结论 → 数据依据 → 对下一步动作的含义。要求敢说别人看不出的东西（例：某篇分享率高但阅读低 = 内容被认可而分发未打开，是"渠道问题"不是"选题问题"）。禁止骑墙，禁止"需要进一步观察"式免责废话。
         ③ 假设验证：把此前复盘或策略里明确提出过的假设逐条对账（成立 / 推翻 / 证据不足）并更新。若历史上没有成文假设，则本轮从②的判断里提炼 1-2 条可证伪假设写入，供次日对账。这是让复盘产生复利的关键，不许跳过。
            - 已备的待验假设（可沿用对账）：FDE·Agent·大会现场线破百（均值约 128）vs 模型快讯线；同一事件连开多篇 = 负收益（9/11 B15 阅读 14、9/12 B16 阅读 2 已实锤）。请用新数据复核这两条是否仍成立。
         ④ 策略调整建议：≤2 条，每条必须是可执行动作（含负责归口 skill 或工具），不是"建议加强"。最后给 ≤1 个待 boss 拍板的 A/B 选择题（禁开放式提问）。
      5) 冷启动样本量护栏（必执行，防止把噪声当信号）：先读 <WORKSPACE_ROOT>/.workbuddy/memory/MEMORY.md 锚定账号当前阶段。当处在冷启动期（总粉 <500、日阅读量级在两位数到百级）时，必须在②判断层每条结论后显式标 [信号强度：强/中/弱]，并在文档顶部写明"样本量小，日间波动多为噪声，单日结论不作为策略转向依据"。指标需连续 3 天同向，或单篇对比差异达数量级，才可标"强"。另需按数据卫生规则先剔除亲友号与自有号的污染影响（口径文件 data/stats_exclusion_list.txt，存在则遵循）。
         注意已实测的经验教训：速评/时效类稿件常在 24h 后才起量，勿凭几小时快照下定论。

      【红线与边界】
      - 全程只读：不改稿、不发布、不建草稿、不回填台账（台账回填需 boss 确认）。群发永远 boss 人工点。发现台账失真时只在复盘里提出建议，不擅自修改台账。
      - 不得重复建设：碰到需要做"发什么/怎么发"决策、或跑 publish_brief / dispatch_feed / cover_next / track_c 自动成包等，一律交棒 .agents/skills/mp-daily-ops-report/SKILL.md，本任务不越界执行。
      - 禁 rm；删除走 tools/safety/safe-delete.sh。
      - 所有判断必须能追到具体数据（BUL-003）；编数字 = B-009 违例。
